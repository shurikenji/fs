<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shupremium{% endblock %}</title>
    <meta name="description" content="AI pricing, balance checks, and key operations in one workspace.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2300ADB5'/%3E%3Cpath d='M16 32h32M32 16l16 16-16 16' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v=20260624">
    {% block head %}{% endblock %}
</head>

<body class="app-body" x-data="{ mobileNav: false }">
    <div class="app-glow app-glow--one"></div>
    <div class="app-glow app-glow--two"></div>

    <header class="site-header" :class="{ 'nav-open': mobileNav }" id="site-header">
        <div class="site-header__inner">
            <a href="/" class="site-logo">
                <span class="site-logo__mark">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                            d="M3 12h18M12 3l9 9-9 9" />
                    </svg>
                </span>
                <span class="site-logo__text">Shupremium</span>
            </a>

            <nav class="site-nav" :class="{ 'is-open': mobileNav }">
                <a href="/" class="site-nav__link {% if request.url.path == '/' %}is-active{% endif %}">Overview</a>
                <a href="/pricing"
                    class="site-nav__link {% if request.url.path == '/pricing' %}is-active{% endif %}">Pricing Explorer</a>
                <a href="/check"
                    class="site-nav__link {% if request.url.path == '/check' %}is-active{% endif %}">Balance Check</a>
                <a href="/keys" class="site-nav__link {% if request.url.path == '/keys' %}is-active{% endif %}">Key Tools</a>
                <a href="/logs" class="site-nav__link {% if request.url.path == '/logs' %}is-active{% endif %}">Usage Logs</a>
            </nav>

            <button type="button" class="nav-toggle" @click="mobileNav = !mobileNav"
                :aria-expanded="mobileNav.toString()" aria-label="Toggle menu">
                <svg x-show="!mobileNav" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M4 7h16M4 12h16M4 17h16" />
                </svg>
                <svg x-show="mobileNav" x-cloak xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </header>

    <main class="site-main">
        <div class="site-container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="site-container">
            <div class="site-footer__inner">
                <span class="site-footer__brand">Shupremium</span>
                <span class="site-footer__copy">AI pricing, balance checks, and key operations in one workspace.</span>
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}

    <script>
    /* —— Header scroll shadow —— */
    (function() {
        const header = document.getElementById('site-header');
        if (!header) return;
        const onScroll = () => {
            header.classList.toggle('is-scrolled', window.scrollY > 8);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
    })();

    /* —— Scroll-triggered reveal —— */
    (function() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.12, rootMargin: '0px 0px -48px 0px' });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    })();
    </script>
</body>

</html>
